<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — RANA Company Admin</title>
  <link rel="icon" type="image/svg+xml" href="../assets/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <a class="brand brand-word" href="../index.html" style="margin-bottom:8px;">
        <img src="../assets/logo.svg" alt="RANA logo" style="width:30px;height:30px;">RANA<span style="color:var(--gold);">.</span>
      </a>
      <button class="admin-nav-btn" data-panel="settings" aria-current="true">Site settings</button>
      <button class="admin-nav-btn" data-panel="about">About page</button>
      <button class="admin-nav-btn" data-panel="projects">Projects</button>
      <button class="admin-nav-btn" data-panel="partners">Partners</button>
      <button class="admin-nav-btn" data-panel="news">News &amp; Events</button>
      <button class="admin-nav-btn" data-panel="faqs">FAQs</button>
      <button class="admin-nav-btn" data-panel="account">Account</button>
      <div style="flex:1;"></div>
      <a class="admin-nav-btn" href="../index.html" target="_blank">View site ↗</a>
      <button class="admin-nav-btn" id="logout-btn">Sign out</button>
    </aside>

    <main class="admin-main">
      <div class="admin-topbar">
        <div>
          <p class="eyebrow" style="margin-bottom:4px;">Admin dashboard</p>
          <h2 id="panel-title" style="margin:0;">Site settings</h2>
        </div>
        <div style="font-size:0.85rem; color:var(--slate);">Signed in as <strong id="admin-username">admin</strong></div>
      </div>

      <div id="panel-root"></div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script src="../js/admin-dashboard.js"></script>
</body>
</html>
