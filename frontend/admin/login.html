<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin sign in — RANA Company</title>
  <link rel="icon" type="image/svg+xml" href="../assets/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <a class="brand" href="../index.html">
        <img src="../assets/logo.svg" alt="RANA Company logo">
        <span class="brand-word">RANA<span>.</span></span>
      </a>
      <h1 style="font-size:1.4rem; text-align:center;">Admin sign in</h1>
      <p style="text-align:center; font-size:0.9rem; margin-bottom:20px;">Manage the site's content.</p>

      <div class="login-error" id="login-error"></div>

      <form id="login-form">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary" type="submit" style="width:100%; justify-content:center;">Sign in</button>
      </form>

      <p class="login-hint">Default credentials: <strong>admin</strong> / <strong>rana</strong> — change the password after first sign in.</p>
    </div>
  </div>
  <script src="../js/admin.js"></script>
</body>
</html>
