      <button class="nav-toggle" aria-label="Toggle menu">☰</button>
      <ul class="nav-links">
        <li><a href="index.html" data-i18n="nav_home" class="">Home</a></li>

        <li><a href="projects.html" data-i18n="nav_projects" class="">Projects</a></li>
        <li><a href="partners.html" data-i18n="nav_partners" class="">Partners</a></li>

      <div class="pillar reveal">
